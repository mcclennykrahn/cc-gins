# First run: python -m ccgins.alignment_experiment
# Uses the small smoke-trained model; no benchmark performance claim.
scenario:
  seed: 900
  duration: 80.0
  outages: [[45.0, 20.0]]
filter:
  filter: inekf
  pseudo: hybrid
  aci: true
  aci_beta: 2.0
  corr_scale: [40.0, 40.0, 40.0]
  robust_gnss_delta: 1.5
  monitor: dual
  cusum_h: 50.0
learning:
  architecture: proposal_tcn
  model: results/proposal_alignment/proposal_tcn.pt
metrics:
  t_start: 30.0
